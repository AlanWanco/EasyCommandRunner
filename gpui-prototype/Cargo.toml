[package]
name = "easy-command-runner-gpui-prototype"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AlanWanco/EasyCommandRunner"
publish = false

[dependencies]
gpui-kit = "=0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "=0.24.2", default-features = false, features = ["gtk"] }
resvg = "=0.46.0"
futures = "=0.3.34"
url = "=2.5.8"

[build-dependencies]
embed-resource = "=3.0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = "=0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility"] }
winreg = "=0.55.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[profile.dev]
debug = 0

[features]
ui-test = ["gpui-kit/test-support"]
