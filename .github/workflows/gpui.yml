name: GPUI build and test

# GPUI is the primary application. Qt keeps its separate legacy workflows.
# Package creation is opt-in; only gpui-release.yml can publish a Release.
on:
  push:
    branches: [gpui]
    paths:
      - gpui-prototype/**
      - src/core/parser.rs
      - src/core/command_line.rs
      - resources/tray_icon.svg
      - resources/app_icon.*
      - .github/workflows/gpui.yml
      - .github/workflows/gpui-release.yml
  pull_request:
    paths:
      - gpui-prototype/**
      - src/core/parser.rs
      - src/core/command_line.rs
      - resources/tray_icon.svg
      - resources/app_icon.*
      - .github/workflows/gpui.yml
      - .github/workflows/gpui-release.yml
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: "Build GPUI distributable packages (does not publish)"
        type: boolean
        default: false
      source_ref:
        description: "Source branch, tag or commit (defaults to selected ref)"
        type: string
        default: ""
      version:
        description: "Optional X.Y.Z; must match gpui-prototype/Cargo.toml"
        type: string
        default: ""
  workflow_call:
    inputs:
      package_artifacts:
        type: boolean
        default: false
      source_ref:
        type: string
        default: ""
      version:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: gpui-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_ref || 'default' }}-${{ inputs.package_artifacts || false }}
  cancel-in-progress: ${{ !inputs.package_artifacts }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  REQUESTED_VERSION: ${{ inputs.version }}

jobs:
  macos-arm64:
    name: macOS arm64 · GPUI
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: gpui-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The root Qt crate has a different toolchain. Cargo must run inside
      # gpui-prototype/ so rust-toolchain.toml selects Rust 1.95.0.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-prototype -> target
          shared-key: gpui-macos-arm64

      - name: Resolve release build identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_support.py version)"
          test -z "$REQUESTED_VERSION" || test "$REQUESTED_VERSION" = "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Test backend and GPUI interactions
        run: cargo test --all-targets --locked --features ui-test -- --test-threads=1

      - name: Test release package metadata
        run: python scripts/test_release_support.py

      - name: Build GPUI application
        run: cargo build --locked

      - name: Build and audit macOS release binary (packaging preflight)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          binary=target/release/easy-command-runner-gpui-prototype
          file "$binary" | grep -F arm64
          otool -L "$binary"
          unexpected="$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/System/Library/|/usr/lib/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unbundled macOS dylibs: $unexpected" >&2
            exit 1
          fi

      # Only macOS has GPUI Kit's Metal headless renderer. Windows/Linux
      # support non-visual tests but not these PNG screenshot assertions.
      - name: Verify headless layouts and render screenshots
        run: cargo run --locked --features ui-test -- "$RUNNER_TEMP/gpui-visual"

      - name: Upload visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpui-ci-macos-arm64-visual
          path: ${{ runner.temp }}/gpui-visual/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CI-only binary (not an app bundle)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpui-ci-macos-arm64-binary
          path: gpui-prototype/target/debug/easy-command-runner-gpui-prototype
          if-no-files-found: warn
          retention-days: 7

      - name: Package and verify GPUI macOS DMG
        if: ${{ inputs.package_artifacts }}
        run: bash scripts/package-macos.sh

      - name: Upload GPUI macOS release package
        if: ${{ inputs.package_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ecr-gpui-macos-arm64
          path: gpui-prototype/dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} · GPUI
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    defaults:
      run:
        working-directory: gpui-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native GPUI and tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libfontconfig1-dev libfreetype6-dev \
            binutils file dpkg-dev libgdk-pixbuf2.0-bin libglib2.0-bin \
            desktop-file-utils curl gh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-prototype -> target
          shared-key: gpui-linux-${{ matrix.arch }}

      - name: Resolve release build identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_support.py version)"
          test -z "$REQUESTED_VERSION" || test "$REQUESTED_VERSION" = "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test backend and non-visual interactions
        run: cargo test --all-targets --locked --features ui-test -- --test-threads=1

      - name: Test release package metadata
        run: python scripts/test_release_support.py

      - name: Build GPUI application
        run: cargo build --locked

      - name: Build and audit Linux release binary (packaging preflight)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          binary=target/release/easy-command-runner-gpui-prototype
          file "$binary"
          case '${{ matrix.arch }}' in
            x86_64) file "$binary" | grep -E 'x86-64|x86_64' ;;
            arm64) file "$binary" | grep -E 'ARM aarch64|ARM64' ;;
          esac
          objdump -p "$binary" | grep NEEDED
          if objdump -p "$binary" | grep -E 'NEEDED[[:space:]]+libQt'; then
            echo 'GPUI binary unexpectedly links Qt' >&2
            exit 1
          fi
          echo 'glibc symbol versions (not a portability guarantee):'
          objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -5
          echo 'AppIndicator is loaded at runtime; NEEDED alone cannot prove it is bundled.'

      - name: Upload CI-only binary (not an AppImage)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpui-ci-linux-${{ matrix.arch }}-binary
          path: gpui-prototype/target/debug/easy-command-runner-gpui-prototype
          if-no-files-found: warn
          retention-days: 7

      - name: Package and verify GPUI Linux AppImage
        if: ${{ inputs.package_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/package-linux.sh '${{ matrix.arch }}'

      - name: Upload GPUI Linux release package
        if: ${{ inputs.package_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ecr-gpui-linux-${{ matrix.arch }}
          path: gpui-prototype/dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows ${{ matrix.arch }} · GPUI
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x86_64
          - runner: windows-11-arm
            arch: arm64
    defaults:
      run:
        working-directory: gpui-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cargo builds the GPUI binary directly. No Qt, CMake generator,
      # or VS 2022-specific Qt libraries are involved here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-prototype -> target
          shared-key: gpui-windows-${{ matrix.arch }}

      - name: Resolve release build identity
        shell: pwsh
        run: |
          $version = & python scripts/release_support.py version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -ne $version) { throw 'Version mismatch' }
          $sha = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "SOURCE_SHA=$sha" >> $env:GITHUB_ENV

      - name: Test backend and non-visual interactions
        run: cargo test --all-targets --locked --features ui-test -- --test-threads=1

      - name: Test release package metadata
        run: python scripts/test_release_support.py

      - name: Build GPUI application
        run: cargo build --locked

      - name: Build GPUI release application (packaging preflight)
        run: cargo build --release --locked

      - name: Verify Windows debug and release PE metadata
        shell: pwsh
        run: |
          foreach ($profile in @('debug', 'release')) {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows-pe.ps1 `
              -Path "target/$profile/easy-command-runner-gpui-prototype.exe" `
              -Arch '${{ matrix.arch }}'
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { exit $exitCode }
          }

      # Tests use GPUI's headless Windows platform. Exercise the real windowed
      # application too: a valid PE may still exit at DirectX/window creation.
      - name: Smoke-test Windows debug and release GUI startup
        shell: pwsh
        run: |
          $failures = 0
          foreach ($profile in @('debug', 'release')) {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows-startup.ps1 `
              -Path "target/$profile/easy-command-runner-gpui-prototype.exe" `
              -Profile $profile
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { $failures++ }
          }
          if ($failures -ne 0) { exit 1 }

      # Debug GPUI dynamically compiles shaders from the runner's Cargo cache;
      # it starts on that runner but fails on other machines. Never ship it.
      - name: Upload standalone release EXE (not an installer)
        uses: actions/upload-artifact@v4
        with:
          name: gpui-ci-windows-${{ matrix.arch }}-release-exe
          path: gpui-prototype/target/release/easy-command-runner-gpui-prototype.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Package and verify GPUI Windows Portable ZIP
        if: ${{ inputs.package_artifacts }}
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/package-windows.ps1 -Arch '${{ matrix.arch }}'
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload GPUI Windows release package
        if: ${{ inputs.package_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ecr-gpui-windows-${{ matrix.arch }}
          path: gpui-prototype/dist/*
          if-no-files-found: error
          retention-days: 14
