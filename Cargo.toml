[package]
name = "easy-command-runner"
version = "0.9.0"
edition = "2021"
authors = ["SleepyKanata"]
description = "A modern cross-platform command runner with GUI"

[lib]
name = "easy_command_runner"
crate-type = ["staticlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time
chrono = "0.4"

# Other utilities
anyhow = "1.0"
thiserror = "1.0"

[features]
default = []
# Platform features will be auto-detected

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
