name: Build and test

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --all-targets --locked

  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtsvg
          install-deps: true
          cache: true

      - name: Configure Qt runtime paths
        shell: bash
        run: |
          test -n "$QT_ROOT_DIR"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=$QT_ROOT_DIR/plugins/platforms" >> "$GITHUB_ENV"
          qmake --version

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DECR_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging dist
          cat > packaging/EasyCommandRunner.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EasyCommandRunner
          Comment=Rust and Qt command runner
          Exec=EasyCommandRunner
          Icon=EasyCommandRunner
          Categories=Utility;
          Terminal=false
          EOF

          curl --fail --retry 3 --location \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output packaging/linuxdeploy
          curl --fail --retry 3 --location \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output packaging/linuxdeploy-plugin-qt
          chmod +x packaging/linuxdeploy packaging/linuxdeploy-plugin-qt

          export PATH="$PWD/packaging:$PATH"
          export QMAKE="$(command -v qmake)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export EXTRA_QT_MODULES="svg;"
          packaging/linuxdeploy \
            --appdir AppDir \
            --executable build/EasyCommandRunner \
            --desktop-file packaging/EasyCommandRunner.desktop \
            --icon-file resources/app_icon.png
          packaging/linuxdeploy --appdir AppDir --plugin qt --output appimage

          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" dist/EasyCommandRunner-linux-x86_64.AppImage

      - name: Collect CI binary
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          mkdir -p dist
          cp build/EasyCommandRunner dist/EasyCommandRunner-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtsvg
          cache: true

      - name: Configure Qt runtime paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR was not set by install-qt-action"
          }
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $plugins = (& $qmake -query QT_INSTALL_PLUGINS).Trim()
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_PLUGIN_PATH=$plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_QPA_PLATFORM_PLUGIN_PATH=$plugins\platforms" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $qmake --version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DECR_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $windeployqt = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $windeployqt --release --no-translations --compiler-runtime `
            --dir dist build\Release\EasyCommandRunner.exe
          if (-not (Test-Path dist\EasyCommandRunner.exe)) {
            throw "windeployqt did not copy EasyCommandRunner.exe"
          }
          $svg = Join-Path $env:QT_ROOT_DIR "plugins\imageformats\qsvg.dll"
          if (Test-Path $svg) {
            New-Item -ItemType Directory -Force dist\imageformats | Out-Null
            Copy-Item $svg dist\imageformats\qsvg.dll -Force
            $svgRuntime = Join-Path $env:QT_ROOT_DIR "bin\Qt6Svg.dll"
            if (Test-Path $svgRuntime) {
              Copy-Item $svgRuntime dist\Qt6Svg.dll -Force
            }
          }
          Compress-Archive -Path dist\* -DestinationPath EasyCommandRunner-windows-x86_64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-windows-x86_64
          path: EasyCommandRunner-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtsvg
          cache: true

      - name: Configure Qt runtime paths
        shell: bash
        run: |
          test -n "$QT_ROOT_DIR"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=$QT_ROOT_DIR/plugins/platforms" >> "$GITHUB_ENV"
          qmake --version

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DECR_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          macdeployqt build/EasyCommandRunner.app -dmg
          dmg="$(find . -maxdepth 2 -type f -name 'EasyCommandRunner.dmg' -print -quit)"
          test -n "$dmg"
          mv "$dmg" dist/EasyCommandRunner-macos-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-macos-arm64
          path: dist/EasyCommandRunner-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-x86_64
      - windows-x86_64
      - macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ecr-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyCommandRunner ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/EasyCommandRunner-linux-x86_64.AppImage
            dist/EasyCommandRunner-windows-x86_64.zip
            dist/EasyCommandRunner-macos-arm64.dmg
