name: Build, test and release

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --all-targets --locked

  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          # Qt 6.8.3 advertises the Linux toolchain as linux_gcc_64.
          arch: linux_gcc_64
          install-deps: true
          cache: true

      - name: Configure Qt runtime paths
        shell: bash
        run: |
          test -n "$QT_ROOT_DIR"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=$QT_ROOT_DIR/plugins/platforms" >> "$GITHUB_ENV"
          qmake --version

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DECR_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging dist
          cat > packaging/EasyCommandRunner.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EasyCommandRunner
          Comment=Rust and Qt command runner
          Exec=EasyCommandRunner
          Icon=EasyCommandRunner
          Categories=Utility;
          Terminal=false
          EOF

          curl --fail --retry 3 --location \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output packaging/linuxdeploy
          curl --fail --retry 3 --location \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output packaging/linuxdeploy-plugin-qt
          chmod +x packaging/linuxdeploy packaging/linuxdeploy-plugin-qt

          export PATH="$PWD/packaging:$PATH"
          export QMAKE="$(command -v qmake)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export EXTRA_QT_MODULES="svg;"
          packaging/linuxdeploy \
            --appdir AppDir \
            --executable build/EasyCommandRunner \
            --desktop-file packaging/EasyCommandRunner.desktop \
            --icon-file resources/app_icon.png \
            --icon-filename EasyCommandRunner
          test -f AppDir/usr/share/applications/EasyCommandRunner.desktop
          test -n "$(find AppDir/usr/share/icons/hicolor -type f -name 'EasyCommandRunner.png' -print -quit)"
          packaging/linuxdeploy --appdir AppDir --plugin qt --output appimage

          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" dist/EasyCommandRunner-linux-x86_64.AppImage

      - name: Collect CI binary
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          mkdir -p dist
          cp build/EasyCommandRunner dist/EasyCommandRunner-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          install-deps: true
          cache: true

      - name: Configure Qt runtime paths
        shell: bash
        run: |
          test -n "$QT_ROOT_DIR"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=$QT_ROOT_DIR/plugins/platforms" >> "$GITHUB_ENV"
          qmake --version

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DECR_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux ARM64 AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging dist
          cat > packaging/EasyCommandRunner.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EasyCommandRunner
          Comment=Rust and Qt command runner
          Exec=EasyCommandRunner
          Icon=EasyCommandRunner
          Categories=Utility;
          Terminal=false
          EOF

          curl --fail --retry 3 --location \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage \
            --output packaging/linuxdeploy
          curl --fail --retry 3 --location \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage \
            --output packaging/linuxdeploy-plugin-qt
          chmod +x packaging/linuxdeploy packaging/linuxdeploy-plugin-qt

          export PATH="$PWD/packaging:$PATH"
          export QMAKE="$(command -v qmake)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export EXTRA_QT_MODULES="svg;"
          packaging/linuxdeploy \
            --appdir AppDir \
            --executable build/EasyCommandRunner \
            --desktop-file packaging/EasyCommandRunner.desktop \
            --icon-file resources/app_icon.png \
            --icon-filename EasyCommandRunner
          test -f AppDir/usr/share/applications/EasyCommandRunner.desktop
          test -n "$(find AppDir/usr/share/icons/hicolor -type f -name 'EasyCommandRunner.png' -print -quit)"
          packaging/linuxdeploy --appdir AppDir --plugin qt --output appimage

          appimage="$(find . -maxdepth 2 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" dist/EasyCommandRunner-linux-arm64.AppImage

      - name: Collect CI binary
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          mkdir -p dist
          cp build/EasyCommandRunner dist/EasyCommandRunner-linux-arm64

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-linux-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: "1"
      # GitHub's Windows runner can suppress QtTest output unless forced.
      QT_FORCE_STDERR_LOGGING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Qt runtime paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR was not set by install-qt-action"
          }
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $plugins = (& $qmake -query QT_INSTALL_PLUGINS).Trim()
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_PLUGIN_PATH=$plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_QPA_PLATFORM_PLUGIN_PATH=$plugins\platforms" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $qmake --version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DECR_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          # Run QtTest directly: GitHub's Windows runner may drop child
          # process output when the test is launched through CTest.
          $log = Join-Path $env:RUNNER_TEMP "ecr-ui-tests.txt"
          $test = Join-Path $env:GITHUB_WORKSPACE "build\Release\ecr_ui_tests.exe"
          & $test "-o" "$log,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $windeployqt = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\Release\EasyCommandRunner.exe"
          # windeployqt deploys dependencies into --dir but does not copy
          # the application executable itself.
          Copy-Item $exe dist\EasyCommandRunner.exe -Force
          & $windeployqt --release --no-translations --compiler-runtime `
            --dir dist $exe
          if (-not (Test-Path dist\EasyCommandRunner.exe)) {
            throw "failed to stage EasyCommandRunner.exe"
          }
          $svg = Join-Path $env:QT_ROOT_DIR "plugins\imageformats\qsvg.dll"
          if (Test-Path $svg) {
            New-Item -ItemType Directory -Force dist\imageformats | Out-Null
            Copy-Item $svg dist\imageformats\qsvg.dll -Force
            $svgRuntime = Join-Path $env:QT_ROOT_DIR "bin\Qt6Svg.dll"
            if (Test-Path $svgRuntime) {
              Copy-Item $svgRuntime dist\Qt6Svg.dll -Force
            }
          }
          Compress-Archive -Path dist\* -DestinationPath EasyCommandRunner-windows-x86_64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-windows-x86_64
          path: EasyCommandRunner-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  windows-arm64:
    name: Windows arm64
    runs-on: windows-11-arm
    env:
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: "1"
      # GitHub's Windows runner can suppress QtTest output unless forced.
      QT_FORCE_STDERR_LOGGING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows_arm64
          target: desktop
          arch: win64_msvc2022_arm64
          cache: true

      - name: Configure Qt runtime paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR was not set by install-qt-action"
          }
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $plugins = (& $qmake -query QT_INSTALL_PLUGINS).Trim()
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_PLUGIN_PATH=$plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_QPA_PLATFORM_PLUGIN_PATH=$plugins\platforms" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $qmake --version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A ARM64
          -DECR_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          # Run QtTest directly: GitHub's Windows runner may drop child
          # process output when the test is launched through CTest.
          $log = Join-Path $env:RUNNER_TEMP "ecr-ui-tests.txt"
          $test = Join-Path $env:GITHUB_WORKSPACE "build\Release\ecr_ui_tests.exe"
          & $test "-o" "$log,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Package Windows ARM64 application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $windeployqt = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\Release\EasyCommandRunner.exe"
          # windeployqt deploys dependencies into --dir but does not copy
          # the application executable itself.
          Copy-Item $exe dist\EasyCommandRunner.exe -Force
          & $windeployqt --release --no-translations --compiler-runtime `
            --dir dist $exe
          if (-not (Test-Path dist\EasyCommandRunner.exe)) {
            throw "failed to stage EasyCommandRunner.exe"
          }
          $svg = Join-Path $env:QT_ROOT_DIR "plugins\imageformats\qsvg.dll"
          if (Test-Path $svg) {
            New-Item -ItemType Directory -Force dist\imageformats | Out-Null
            Copy-Item $svg dist\imageformats\qsvg.dll -Force
            $svgRuntime = Join-Path $env:QT_ROOT_DIR "bin\Qt6Svg.dll"
            if (Test-Path $svgRuntime) {
              Copy-Item $svgRuntime dist\Qt6Svg.dll -Force
            }
          }
          Compress-Archive -Path dist\* -DestinationPath EasyCommandRunner-windows-arm64.zip -Force

      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-windows-arm64
          path: EasyCommandRunner-windows-arm64.zip
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure Qt runtime paths
        shell: bash
        run: |
          test -n "$QT_ROOT_DIR"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=$QT_ROOT_DIR/plugins/platforms" >> "$GITHUB_ENV"
          qmake --version

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DECR_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist packaging/dmg-root
          # Deploy Qt libraries into the bundle first.  macdeployqt's -dmg
          # shortcut creates a disk image without the Applications link.
          macdeployqt build/EasyCommandRunner.app
          test -d build/EasyCommandRunner.app/Contents/Resources
          test -f build/EasyCommandRunner.app/Contents/Resources/app_icon.icns

          rm -rf packaging/dmg-root
          mkdir -p packaging/dmg-root
          cp -R build/EasyCommandRunner.app packaging/dmg-root/
          ln -s /Applications packaging/dmg-root/Applications
          test -L packaging/dmg-root/Applications
          hdiutil create \
            -volname "EasyCommandRunner" \
            -srcfolder packaging/dmg-root \
            -ov \
            -format UDZO \
            dist/EasyCommandRunner-macos-arm64.dmg
          test -f dist/EasyCommandRunner-macos-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-macos-arm64
          path: dist/EasyCommandRunner-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-x86_64
      - linux-arm64
      - windows-x86_64
      - windows-arm64
      - macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ecr-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyCommandRunner ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/EasyCommandRunner-linux-x86_64.AppImage
            dist/EasyCommandRunner-linux-arm64.AppImage
            dist/EasyCommandRunner-windows-x86_64.zip
            dist/EasyCommandRunner-windows-arm64.zip
            dist/EasyCommandRunner-macos-arm64.dmg
